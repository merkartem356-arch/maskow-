plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client { client(); systemProperty 'neoforge.enabledGameTestNamespaces', mod_id }
        server { server(); programArgument '--nogui'; systemProperty 'neoforge.enabledGameTestNamespaces', mod_id }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(ProcessResources).configureEach {
    var props = [minecraft_version: minecraft_version, neo_version: neo_version,
                 loader_version_range: loader_version_range, mod_id: mod_id,
                 mod_name: mod_name, mod_license: mod_license,
                 mod_version: mod_version, mod_authors: mod_authors,
                 mod_description: mod_description]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
