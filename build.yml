name: Build mod jars

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.loader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: Forge
            directory: tentnets-forge
            artifact: tentnets-forge-1.21.1
          - loader: NeoForge
            directory: tentnets-neoforge
            artifact: tentnets-neoforge-1.21.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build JAR
        working-directory: ${{ matrix.directory }}
        run: gradle --no-daemon build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.directory }}/build/libs/*.jar
          if-no-files-found: error
